name: Run tests

on: [push, pull_request]

jobs:
  test:
    services:
      mariadb:
        image: mariadb
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
        # Ensure docker waits for mariadb to start
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1

      # Start PMG in server mode to intercept package installs
      - uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"

      - uses: actions/cache@v4
        id: cache-composer
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer

      - uses: actions/cache@v4
        id: cache-wp-cli
        with:
          path: ~/.wp-cli/cache
          key: ${{ runner.os }}-wp-cli

      - name: Run tests
        run: .github/run-tests

      - name: Enforce PMG policy
        if: always()
        run: pmg proxy stop --fail-on-violation

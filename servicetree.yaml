service: razorpay-woocommerce  # required, canonical slug — immutable once registered
displayName: "Razorpay for WooCommerce"  # required, human-readable name — readme.txt plugin header "=== Razorpay for WooCommerce ===", the name the plugin ships under
description: "Official Razorpay payment-gateway plugin for WooCommerce/WordPress merchants: it renders Razorpay Checkout (standard and Magic Checkout/1CC) at WooCommerce checkout, and reconciles payment, refund and webhook events back into WooCommerce order state, in India and for Curlec in Malaysia."  # required, one-sentence description of what the service does — readme.txt ("This is the official Razorpay payment gateway plugin for WooCommerce... Accept payments via 100+ payment modes", FPX/DuitNow/eWallets for Malaysia, refunds) plus the repo contents (woo-razorpay.php, btn-1cc-checkout.js, checkout-block.php, razorpay-sdk/)
type: library  # required, one of: service | worker | cron | library | pipeline — a distributable PHP plugin, not a Razorpay deployment: 210 PHP files, readme.txt with WordPress plugin headers (Stable tag 4.8.7), release.sh, and no Dockerfile, helm chart, Spinnaker pipeline or alert ruleset. It runs inside the merchant's WordPress install
tier: T1  # required, one of: T0 | T1 | T2 | T3 · Payments Reliability sheet Priority P1 → T1; kept — a broken release breaks checkout for every WooCommerce merchant that upgrades, even though Razorpay operates no runtime for it
lifecycle: live  # optional, one of: incubating | live | deprecated | retired (default: live)
aliases: ["woo-razorpay"]  # other names this service is known by — the plugin's entry file and distribution slug are woo-razorpay (woo-razorpay.php, release.sh), and its Slack channel is #woo-razorpay

domain: pg-growth/magic-checkout  # required, two-level domain/subgroup slug — the sheet carries no BU and the repo has no .github/repo_owners.json, so ownership comes from the engineering knowledge base, which records service.razorpay-woocommerce under the magic-checkout POD (knowledge/domains/magic-checkout/nodes/services/razorpay-woocommerce.yaml); area reused from the existing pg-growth/magic-checkout services (magic-plugins is the parallel Shopify integration, magic-checkout-service the backend). The repo's 1CC entry points (btn-1cc-checkout.js) agree

owner:
  team:  # required, owning team slug — TO FILL: this repo has no CODEOWNERS file, .github/repo_owners.json carries no team slug, and the GitHub repository-teams API is not readable with the current token; ask the POD lead for the owning GitHub team
  pm:  # product manager — TO FILL: no PM is recorded in .github/repo_owners.json, the DevRev runnable or SuccessFactors for this service, and deriving one from the org tree is unreliable. Ask the POD lead.

links:
  repo: "https://github.com/razorpay/razorpay-woocommerce"  # canonical GitHub repo URL
  alerts_repo:  # this service's alert rules in razorpay/alert-rules — TO FILL: no matching ruleset found; add one in razorpay/alert-rules, then link the file here
  slos:  # SLO definitions — TO FILL: no slo.yaml at this repo root and no sloth ruleset for it under razorpay/alert-rules/slo/prod (the two places SLOs are defined today); add one there and link it here
  slack_channel: "#woo-razorpay"  # primary Slack channel for this service — 35 members and named for the plugin's own slug (woo-razorpay); #woocommerce-alerts (4) is the alert-only sibling. The knowledge base records #magic-rewire for this service, but that is the 598-member 1-click-checkout working group covering the whole POD, not this plugin
  zenduty_policy:  # Zenduty policy/service name used for paging — TO FILL: the service-to-policy mapping is not in DevRev or alert-rules for this service; it lives in the external Zenduty policies sheet
  oncall_handle:  # Slack/PagerDuty oncall handle or usergroup — TO FILL: not set on the DevRev runnable
  runbook:  # link to the incident runbook — TO FILL: no runbook directory for this service in razorpay/rzp-oncall-agent; add one or link the Google Doc / alpha.razorpay.com page
  api_docs:  # API documentation — TO FILL: no swagger/openapi/proto found in the repo tree; link the API spec or Postman collection
  dashboard:  # primary dashboard — TO FILL: the plugin runs in merchant WordPress installs, so Razorpay has no runtime metrics for it; no alert-rules ruleset (hence no vajra_link) and no Grafana match on vajra (India). If plugin-version adoption is tracked anywhere, link that instead
  logs_and_traces: "https://razorpay-prod.app.coralogix.in/#/query-new/archive-logs"  # org-standard prod Coralogix — filter subsystem "razorpay-woocommerce"
  strategy_okr:  # TO FILL: link the FY strategy doc for the owning group.
  risk_assessment:  # TO FILL: no .agents/skills/risk-assessment in this repo; add the per-repo risk-assessment skill
  regions:  # per-region links — TO FILL: no prod region deployment found for this service in spinacode or alert-rules; add a block per geography once it ships

dependencies: []  # optional, declared service dependencies — TO FILL: shape: - service: <slug> for internal deps, - vendor: <name> for external (gateways, banks)
